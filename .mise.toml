[tools]
task = "latest"
"go:github.com/haryoiro/oasc" = "latest"

[tasks.build]
description = "Build the binary"
sources = ["**/*.go"]
outputs = ["dist/oasc_${GOOS}_${GOARCH}${EXT}"]
run = """
VERSION=0.1.0
BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
GIT_COMMIT=$(git rev-parse --short HEAD)
go build -ldflags="-X main.Version=$VERSION -X main.BuildTime=$BUILD_TIME -X main.GitCommit=$GIT_COMMIT" -o dist/oasc_${GOOS}_${GOARCH}${EXT} ./cmd/oasc
"""

[tasks.build-all]
description = "Build binaries for all platforms"
depends = ["clean"]
run = """
GOOS=darwin GOARCH=amd64 EXT= mise run build
GOOS=darwin GOARCH=arm64 EXT= mise run build
GOOS=linux GOARCH=amd64 EXT= mise run build
GOOS=linux GOARCH=arm64 EXT= mise run build
GOOS=windows GOARCH=amd64 EXT=.exe mise run build
"""

[tasks.test]
description = "Run tests"
sources = ["**/*.go"]
run = "go test ./... -v"

[tasks.clean]
description = "Clean build artifacts"
run = "rm -rf dist/*"

[tasks.install]
description = "Install the binary"
depends = ["build"]
run = "go install ./cmd/oasc"

[tasks.release]
description = "Create release archives"
depends = ["build-all"]
run = """
mise run clean
mise run build-all
gh release create v$VERSION --title "Release v$VERSION" --notes "Release v$VERSION" dist/*.tar.gz dist/*.zip
"""

[tasks.release-tag]
depends = ["build-all"]
run = """
./scripts/release-tag
"""
