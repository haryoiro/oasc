[tools]
task = "latest"

[tasks.build]
description = "Build the binary"
sources = ["**/*.go"]
outputs = ["bin/oasc"]
run = """
VERSION=0.1.0
BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
GIT_COMMIT=$(git rev-parse --short HEAD)
LDFLAGS="-X 'main.Version=$VERSION' -X 'main.BuildTime=$BUILD_TIME' -X 'main.GitCommit=$GIT_COMMIT'"

mkdir -p bin
go build -ldflags "$LDFLAGS" -o bin/oasc
"""

[tasks.build-all]
description = "Build binaries for all platforms"
depends = ["clean"]
run = """
VERSION=0.1.0
BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
GIT_COMMIT=$(git rev-parse --short HEAD)
LDFLAGS="-X 'main.Version=$VERSION' -X 'main.BuildTime=$BUILD_TIME' -X 'main.GitCommit=$GIT_COMMIT'"

mkdir -p dist

GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/oasc_darwin_amd64
GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/oasc_darwin_arm64
GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/oasc_linux_amd64
GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/oasc_linux_arm64
GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/oasc_windows_amd64.exe
"""

[tasks.test]
description = "Run tests"
sources = ["**/*.go"]
run = "go test -v ./..."

[tasks.clean]
description = "Clean build artifacts"
run = "rm -rf bin/ dist/"

[tasks.install]
description = "Install the binary"
depends = ["build"]
run = "cp bin/oasc /usr/local/bin/"

[tasks.release]
description = "Create release archives"
depends = ["build-all"]
run = """
VERSION=0.1.0
cd dist
tar -czf oasc_${VERSION}_darwin_amd64.tar.gz oasc_darwin_amd64
tar -czf oasc_${VERSION}_darwin_arm64.tar.gz oasc_darwin_arm64
tar -czf oasc_${VERSION}_linux_amd64.tar.gz oasc_linux_amd64
tar -czf oasc_${VERSION}_linux_arm64.tar.gz oasc_linux_arm64
zip oasc_${VERSION}_windows_amd64.zip oasc_windows_amd64.exe
"""
